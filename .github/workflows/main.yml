name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-

      - name: Cache Astro build (image processing)
        uses: actions/cache@v4
        with:
          path: .astro
          key: astro-${{ hashFiles('src/images/**') }}
          restore-keys: astro-

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Start SSH agent and add deploy key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: Push to deployment repo (SSH)
        run: |
          git config --global user.name "Stefan Wild"
          git config --global user.email "wildstefan1221@gmail.com"

          git clone git@github.com:beerDeerHex/handgemacht-deploy.git deploy-repo

          rm -rf deploy-repo/*
          cp -r dist/* deploy-repo/
          cp -r api deploy-repo/
          rsync -r --exclude='SETUP.md' --exclude='*.example' admin/ deploy-repo/admin/
          cp -r cronjobs deploy-repo/
          cp -r utilities deploy-repo/
          cp -r config/* deploy-repo/

          cd deploy-repo
          git add .
          git commit -m "Deploy from dev repo on $(date)" || echo "No changes to commit"
          git push origin HEAD
